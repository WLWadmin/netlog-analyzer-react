name: PR Checks

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup npm
        run: |
          npm install -g npm@11.12.1
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: CI=true npm test -- --watchAll=false --runInBand

      - name: Build
        env:
          REACT_APP_ENABLE_TRACE_ANALYSIS: '1'
        run: npm run build
