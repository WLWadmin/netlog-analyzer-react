<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1740" viewBox="0 0 1800 1740" role="img" aria-labelledby="title description">
  <title id="title">浏览器诊断工作台完整项目数据流程图</title>
  <desc id="description">完整展示文件接入、容器探测、格式确认、四类解析器、Worker 数据仓库、NetLog Dataset、Trace Workbench、React 状态、联合诊断、结果页面和本地导出。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eff6ff"/><stop offset="0.5" stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfdf5"/></linearGradient>
    <style>
      .page-title{font:700 36px "Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}.page-subtitle{font:400 16px "Microsoft YaHei","PingFang SC",sans-serif;fill:#64748b}.section-label{font:700 14px "Microsoft YaHei","PingFang SC",sans-serif;fill:#475569;letter-spacing:1.5px}.node-title{font:700 17px "Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}.node-copy{font:400 13px "Microsoft YaHei","PingFang SC",sans-serif;fill:#475569}.small-label{font:600 12px "Microsoft YaHei","PingFang SC",sans-serif;fill:#475569}.lane-title{font:700 19px "Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}.lane-id{font:600 12px Consolas,"Microsoft YaHei",sans-serif;fill:#64748b}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.line-blue{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#arrowBlue)}.line-teal{fill:none;stroke:#0f766e;stroke-width:2.2;marker-end:url(#arrowTeal)}.line-dashed{fill:none;stroke:#0f766e;stroke-width:2.2;stroke-dasharray:8 7;marker-end:url(#arrowTeal)}.divider{stroke:#cbd5e1;stroke-width:1;stroke-dasharray:5 8}
    </style>
  </defs>
  <rect width="1800" height="1740" fill="#f8fafc"/><rect width="1800" height="112" fill="url(#headerGradient)"/>
  <text x="900" y="50" text-anchor="middle" class="page-title">浏览器诊断工作台：完整项目数据流程</text><text x="900" y="82" text-anchor="middle" class="page-subtitle">格式识别、Worker 解析、证据索引、联合诊断与结果展示均在浏览器本地完成</text>

  <text x="42" y="150" class="section-label">01  文件接入</text>
  <rect x="610" y="126" width="580" height="72" rx="10" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/><text x="900" y="156" text-anchor="middle" class="node-title">用户选择诊断文件</text><text x="900" y="180" text-anchor="middle" class="node-copy">拖拽或选择本地文件</text><path d="M900 198V224" class="line-blue"/>
  <rect x="610" y="224" width="580" height="72" rx="10" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/><text x="900" y="254" text-anchor="middle" class="node-title">UploadEntry / UploadZone</text><text x="900" y="278" text-anchor="middle" class="node-copy">上传入口、文件选择与用户提示</text><path d="M900 296V322" class="line-blue"/>
  <rect x="610" y="322" width="580" height="78" rx="10" fill="#eff6ff" stroke="#93c5fd" filter="url(#shadow)"/><text x="900" y="353" text-anchor="middle" class="node-title">useAnalysisIntake</text><text x="900" y="378" text-anchor="middle" class="node-copy">任务状态 · 真实进度 · 取消 · 解析结果延迟进入页面</text><path d="M900 400V428" class="line-blue"/>

  <text x="42" y="455" class="section-label">02  容器与格式探测</text>
  <rect x="610" y="428" width="580" height="76" rx="10" fill="#f1f5f9" stroke="#94a3b8" filter="url(#shadow)"/><text x="900" y="459" text-anchor="middle" class="node-title">文件容器与内容探测</text><text x="900" y="483" text-anchor="middle" class="node-copy">magic bytes、文件前缀、根结构与关键字段</text>
  <path d="M715 504V535H285V560" class="line"/><text x="474" y="528" class="small-label">ZIP</text><rect x="125" y="560" width="320" height="64" rx="9" fill="#fff1f2" stroke="#fda4af" filter="url(#shadow)"/><text x="285" y="588" text-anchor="middle" class="node-title">拒绝并提示解压</text><text x="285" y="611" text-anchor="middle" class="node-copy">ZIP 当前不支持</text>
  <path d="M825 504V536H690V560" class="line"/><text x="725" y="528" class="small-label">GZIP</text><rect x="530" y="560" width="320" height="64" rx="9" fill="#fefce8" stroke="#fde047" filter="url(#shadow)"/><text x="690" y="588" text-anchor="middle" class="node-title">浏览器本地解压</text><text x="690" y="611" text-anchor="middle" class="node-copy">DecompressionStream</text>
  <path d="M1015 504V536H1110V560" class="line"/><text x="1036" y="528" class="small-label">普通文件</text><path d="M690 624V650H900" class="line"/><path d="M1110 560V650H900" class="line"/>
  <path d="M900 650L1030 716L900 782L770 716Z" fill="#fff" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/><text x="900" y="710" text-anchor="middle" class="node-title">识别数据格式</text><text x="900" y="736" text-anchor="middle" class="node-copy">内容证据优先于扩展名</text>
  <path d="M1030 716H1470V660" class="line"/><text x="1320" y="703" class="small-label">格式冲突 / 证据不足</text><rect x="1320" y="584" width="300" height="76" rx="9" fill="#fff7ed" stroke="#fb923c" filter="url(#shadow)"/><text x="1470" y="615" text-anchor="middle" class="node-title">用户确认解析器</text><text x="1470" y="640" text-anchor="middle" class="node-copy">不静默切换格式</text>

  <line x1="42" y1="810" x2="1758" y2="810" class="divider"/><text x="42" y="840" class="section-label">03  专用解析链路</text>
  <rect x="35" y="860" width="410" height="430" rx="14" fill="#fff7ed" stroke="#fdba74"/><rect x="475" y="860" width="410" height="430" rx="14" fill="#eff6ff" stroke="#93c5fd"/><rect x="915" y="860" width="410" height="430" rx="14" fill="#f5f3ff" stroke="#c4b5fd"/><rect x="1355" y="860" width="410" height="430" rx="14" fill="#ecfdf5" stroke="#86efac"/>
  <path d="M795 762V822H240V890" class="line"/><text x="250" y="806" class="small-label">HAR</text><path d="M865 780V828H680V890" class="line"/><text x="648" y="818" class="small-label">NetLog</text><path d="M935 780V828H1120V890" class="line"/><text x="1088" y="818" class="small-label">Trace</text><path d="M1005 762V822H1560V890" class="line"/><text x="1510" y="806" class="small-label">Go 服务日志</text>
  <path d="M1420 660V790H240V890" class="line"/><path d="M1450 660V800H680V890" class="line"/><path d="M1490 660V800H1120V890" class="line"/><path d="M1520 660V790H1560V890" class="line"/>

  <text x="240" y="900" text-anchor="middle" class="lane-title">HAR 解析器</text><text x="240" y="922" text-anchor="middle" class="lane-id">har@1</text>
  <rect x="70" y="944" width="340" height="72" rx="9" fill="#fff" stroke="#fdba74" filter="url(#shadow)"/><text x="240" y="974" text-anchor="middle" class="node-title">Analysis Worker · parseHar</text><text x="240" y="998" text-anchor="middle" class="node-copy">根结构校验 · 损坏 HAR 修复</text><path d="M240 1016V1040" class="line"/>
  <rect x="70" y="1040" width="340" height="76" rx="9" fill="#fff" stroke="#fed7aa"/><text x="240" y="1070" text-anchor="middle" class="node-title">Entry 标准化 → Timing / Size</text><text x="240" y="1095" text-anchor="middle" class="node-copy">资源分类 · 状态判定 · fromHar 诊断</text><path d="M155 1016V1138" class="line"/>
  <rect x="70" y="1138" width="340" height="78" rx="9" fill="#ffedd5" stroke="#fdba74"/><text x="240" y="1168" text-anchor="middle" class="node-title">Worker 原始数据仓库</text><text x="240" y="1193" text-anchor="middle" class="node-copy">rawDataId 按需读取响应体与字段</text>

  <text x="680" y="900" text-anchor="middle" class="lane-title">NetLog 解析器</text><text x="680" y="922" text-anchor="middle" class="lane-id">chromium-netlog@1</text>
  <path d="M680 940L752 982L680 1024L608 982Z" fill="#fff" stroke="#60a5fa" stroke-width="2"/><text x="680" y="978" text-anchor="middle" class="node-title">是否大文件</text><text x="680" y="999" text-anchor="middle" class="node-copy">100 MiB 阈值</text>
  <path d="M620 1005H535V1045" class="line"/><text x="530" y="1028" class="small-label">普通文件</text><path d="M740 1005H825V1045" class="line"/><text x="775" y="1028" class="small-label">大文件</text>
  <rect x="495" y="1045" width="170" height="76" rx="9" fill="#fff" stroke="#93c5fd"/><text x="580" y="1074" text-anchor="middle" class="node-title">Analysis Worker</text><text x="580" y="1098" text-anchor="middle" class="node-copy">parseLog</text>
  <rect x="695" y="1045" width="170" height="76" rx="9" fill="#fff" stroke="#93c5fd"/><text x="780" y="1074" text-anchor="middle" class="node-title">流式扫描</text><text x="780" y="1098" text-anchor="middle" class="node-copy">StreamingAnalyzer</text>
  <path d="M580 1121V1144H680" class="line"/><path d="M780 1121V1144H680" class="line"/><rect x="495" y="1144" width="370" height="72" rx="9" fill="#dbeafe" stroke="#60a5fa"/><text x="680" y="1174" text-anchor="middle" class="node-title">AnalysisResult + 事件预览</text><text x="680" y="1198" text-anchor="middle" class="node-copy">请求生命周期 · Source Graph · 诊断规则</text>
  <path d="M780 1121V1232" class="line"/><path d="M680 1216V1232" class="line"/><rect x="495" y="1232" width="370" height="44" rx="8" fill="#bfdbfe" stroke="#60a5fa"/><text x="680" y="1251" text-anchor="middle" class="small-label">Dataset 全量索引 · DNS / Proxy / TLS</text><text x="680" y="1268" text-anchor="middle" class="small-label">HTTP/2 / QUIC / Socket 状态 reducers</text>

  <text x="1120" y="900" text-anchor="middle" class="lane-title">Performance Trace 解析器</text><text x="1120" y="922" text-anchor="middle" class="lane-id">chromium-performance-trace@1</text>
  <rect x="950" y="944" width="340" height="82" rx="9" fill="#fff" stroke="#c4b5fd" filter="url(#shadow)"/><text x="1120" y="974" text-anchor="middle" class="node-title">Trace Analysis Worker</text><text x="1120" y="998" text-anchor="middle" class="node-copy">readTraceFile · guards · Facts 聚合</text><path d="M1120 1026V1050" class="line"/>
  <rect x="950" y="1050" width="340" height="72" rx="9" fill="#fff" stroke="#ddd6fe"/><text x="1120" y="1080" text-anchor="middle" class="node-title">TraceAnalysisResult</text><text x="1120" y="1104" text-anchor="middle" class="node-copy">性能事实 · 规则评分 · 诊断发布门禁</text><path d="M1210 1026V1144" class="line"/>
  <rect x="950" y="1144" width="340" height="76" rx="9" fill="#ede9fe" stroke="#a78bfa"/><text x="1120" y="1174" text-anchor="middle" class="node-title">Workbench 会话</text><text x="1120" y="1199" text-anchor="middle" class="node-copy">时间轴与高级面板按需查询</text>

  <text x="1560" y="900" text-anchor="middle" class="lane-title">Go 服务日志解析器</text><text x="1560" y="922" text-anchor="middle" class="lane-id">go-service-log@1</text>
  <rect x="1390" y="944" width="340" height="76" rx="9" fill="#fff" stroke="#86efac" filter="url(#shadow)"/><text x="1560" y="974" text-anchor="middle" class="node-title">Analysis Worker · parseLogFile</text><text x="1560" y="998" text-anchor="middle" class="node-copy">逐行解析 · Success / Error / Retrying 分类</text><path d="M1560 1020V1050" class="line"/>
  <rect x="1390" y="1050" width="340" height="96" rx="9" fill="#dcfce7" stroke="#4ade80"/><text x="1560" y="1080" text-anchor="middle" class="node-title">LogAnalysisResult</text><text x="1560" y="1105" text-anchor="middle" class="node-copy">groupEntries · calculateStats</text><text x="1560" y="1128" text-anchor="middle" class="node-copy">generateInsight · 解析覆盖率</text>

  <line x1="42" y1="1315" x2="1758" y2="1315" class="divider"/><text x="42" y="1345" class="section-label">04  证据融合、结果提交与联合诊断</text>
  <path d="M325 1116V1328H590V1370" class="line-dashed"/><path d="M680 1216V1328H590V1370" class="line-dashed"/><rect x="360" y="1370" width="460" height="90" rx="10" fill="#f0fdfa" stroke="#2dd4bf" filter="url(#shadow)"/><text x="590" y="1403" text-anchor="middle" class="node-title">HAR + NetLog 联合诊断</text><text x="590" y="1428" text-anchor="middle" class="node-copy">同次复现文件按请求、域名、时间与 source 交叉验证</text>
  <path d="M325 1116V1300H900V1370" class="line"/><path d="M680 1216V1300H900V1370" class="line"/><path d="M1120 1122V1300H900V1370" class="line"/><path d="M1560 1146V1300H900V1370" class="line"/><rect x="860" y="1370" width="580" height="90" rx="10" fill="#fff" stroke="#94a3b8" filter="url(#shadow)"/><text x="1150" y="1403" text-anchor="middle" class="node-title">诊断与证据汇总 → React 状态</text><text x="1150" y="1428" text-anchor="middle" class="node-copy">证据融合 · 置信度/限制 · 发布门禁 · commitIntakeResult 路由</text>

  <line x1="42" y1="1490" x2="1758" y2="1490" class="divider"/><text x="42" y="1520" class="section-label">05  结果页面与本地输出</text>
  <path d="M1010 1460V1528H240V1550" class="line-blue"/><path d="M1100 1460V1536H680V1550" class="line-blue"/><path d="M1200 1460V1536H1120V1550" class="line-blue"/><path d="M1290 1460V1528H1560V1550" class="line-blue"/><path d="M590 1460V1510H680V1550" class="line-teal"/>
  <path d="M240 1216V1480H240V1550" class="line"/><path d="M410 1177H450V1480H680V1550" class="line"/><path d="M680 1276V1550" class="line"/><path d="M1120 1220V1550" class="line"/>
  <rect x="55" y="1550" width="370" height="106" rx="11" fill="#fff7ed" stroke="#fdba74" filter="url(#shadow)"/><text x="240" y="1584" text-anchor="middle" class="node-title">HAR 页面</text><text x="240" y="1610" text-anchor="middle" class="node-copy">摘要 · 诊断 · 请求 · 瀑布图</text><text x="240" y="1635" text-anchor="middle" class="node-copy">响应预览 · 原始证据</text>
  <rect x="495" y="1550" width="370" height="106" rx="11" fill="#eff6ff" stroke="#93c5fd" filter="url(#shadow)"/><text x="680" y="1584" text-anchor="middle" class="node-title">NetLog 页面</text><text x="680" y="1610" text-anchor="middle" class="node-copy">结论 · 请求 · 证据链 · 专家分析</text><text x="680" y="1635" text-anchor="middle" class="node-copy">原始事件 · Dataset 查询</text>
  <rect x="935" y="1550" width="370" height="106" rx="11" fill="#f5f3ff" stroke="#c4b5fd" filter="url(#shadow)"/><text x="1120" y="1584" text-anchor="middle" class="node-title">Trace 页面</text><text x="1120" y="1610" text-anchor="middle" class="node-copy">主线程 · 渲染 · 交互 · 网络</text><text x="1120" y="1635" text-anchor="middle" class="node-copy">全部证据 · 时间轴</text>
  <rect x="1375" y="1550" width="370" height="106" rx="11" fill="#ecfdf5" stroke="#86efac" filter="url(#shadow)"/><text x="1560" y="1584" text-anchor="middle" class="node-title">日志页面</text><text x="1560" y="1610" text-anchor="middle" class="node-copy">概览 · 流程 · 性能 · 原始日志</text><text x="1560" y="1635" text-anchor="middle" class="node-copy">解析覆盖率</text>
  <path d="M240 1656V1682H900" class="line"/><path d="M680 1656V1682H900" class="line"/><path d="M1120 1656V1682H900" class="line"/><path d="M1560 1656V1682H900" class="line"/><rect x="650" y="1682" width="500" height="44" rx="9" fill="#0f172a"/><text x="900" y="1710" text-anchor="middle" style="font:600 14px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#f8fafc">复制证据或导出 Markdown / JSON / CSV / TXT 报告</text>
